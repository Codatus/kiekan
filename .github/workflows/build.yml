# KiekAn! – automatischer Build
# Baut und testet bei jeder Änderung; bei einem Tag v* wird das .deb als
# Release veröffentlicht.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-l10n-tools libqt6svg6-dev qt6-pdf-dev \
            libgl-dev libmpv-dev libexiv2-dev libtesseract-dev libqpdf-dev \
            libheif-dev libraw-dev libopenjp2-7-dev libdjvulibre-dev

      - name: Bauen
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Testen
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Debian-Paket
        run: cd build && cpack -G DEB

      - uses: actions/upload-artifact@v4
        with:
          name: kiekan-deb
          path: build/*.deb

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb
          generate_release_notes: true

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p ntldd:p
            qt6-base:p qt6-svg:p qt6-imageformats:p qt6-tools:p qt6-translations:p qt6-pdf:p
            mpv:p exiv2:p qpdf:p libheif:p libraw:p openjpeg2:p djvulibre:p
            tesseract-ocr:p tesseract-data-eng:p tesseract-data-deu:p tesseract-data-frk:p

      - name: Bauen
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Testen
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Portables Paket
        run: |
          VERSION=$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/CMakeCache.txt)
          packaging/windows/deploy.sh build dist/KiekAn
          # Rauchtest: MCP-Server des fertigen Pakets (braucht das Plugin „offscreen“)
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
                        '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | dist/KiekAn/kiekan.exe --mcp | tee mcp.out
          grep -q '"extract_text"' mcp.out
          (cd dist && zip -qr "KiekAn-${VERSION}-windows-x64.zip" KiekAn)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: kiekan-windows
          path: dist/*.zip

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
