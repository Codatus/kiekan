# KiekAn! – automatischer Build
# Bei jeder Änderung nur ein kurzer Linux-Build mit Tests (spart Actions-Minuten).
# Alle Pakete (Distributionen, ARM64, macOS, Windows) bei einem Tag v* – dann
# auch als Release – oder von Hand („Run workflow“).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Ältere Läufe desselben Zweigs abbrechen, wenn schnell nachgeschoben wird
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Nur lesen; Schreibrecht hat allein der Release-Job am Ende.
permissions:
  contents: read

jobs:
  linux:
    # Je Distribution ein eigenes .deb, weil die Bibliotheksversionen abweichen
    strategy:
      fail-fast: false
      matrix:
        # Volle Matrix nur für Releases/von Hand; sonst nur Ubuntu 24.04 amd64
        image: ${{ fromJSON((startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && '["ubuntu:22.04", "ubuntu:24.04", "debian:12", "debian:13"]' || '["ubuntu:24.04"]') }}
        runner: ${{ fromJSON((startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && '["ubuntu-24.04", "ubuntu-24.04-arm"]' || '["ubuntu-24.04"]') }}   # amd64 und arm64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Abhängigkeiten installieren
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config file dpkg-dev \
            qt6-base-dev qt6-base-dev-tools qt6-l10n-tools libqt6svg6-dev qt6-pdf-dev libqt6opengl6-dev \
            libgl-dev libmpv-dev libexiv2-dev libtesseract-dev libqpdf-dev \
            libheif-dev libraw-dev libopenjp2-7-dev libdjvulibre-dev libturbojpeg0-dev

      - name: Bauen
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
                -DKIEKAN_PKG_SUFFIX=$(echo "${{ matrix.image }}" | tr -d :)
          cmake --build build

      - name: Testen
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Debian-Paket
        run: cd build && cpack -G DEB

      - name: Paket installieren und Rauchtest
        env:
          DEBIAN_FRONTEND: noninteractive
          QT_QPA_PLATFORM: offscreen
        run: |
          apt-get install -y ./build/kiekan_*.deb
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
                         '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | kiekan --mcp | tee mcp.out
          grep -q '"extract_text"' mcp.out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kiekan-${{ matrix.runner }}-${{ strategy.job-index }}
          path: build/*.deb


  rpm:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    # Fedora und openSUSE: je ein eigenes .rpm
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:43', 'fedora:44', 'opensuse/tumbleweed', 'opensuse/leap:16.0']
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        include:
          - image: fedora:43
            suffix: fc43
          - image: fedora:44
            suffix: fc44
          - image: opensuse/tumbleweed
            suffix: opensuse
          - image: opensuse/leap:16.0
            suffix: leap16
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Abhängigkeiten installieren
        run: |
          if command -v dnf >/dev/null; then
            dnf -y install git cmake gcc-c++ ninja-build rpm-build qt6-qtbase-devel qt6-qtsvg-devel \
              qt6-qttools-devel qt6-qtimageformats qt6-qtpdf-devel mpv-devel exiv2-devel tesseract-devel \
              leptonica-devel qpdf-devel libheif-devel LibRaw-devel openjpeg2-devel djvulibre-devel 'pkgconfig(libturbojpeg)'
          else
            zypper -n ref
            zypper -n in --force-resolution diffutils
            zypper -n in git tar gzip cmake gcc-c++ ninja rpm-build qt6-base-devel qt6-svg-devel \
              qt6-tools-linguist qt6-linguist-devel qt6-imageformats qt6-pdf-devel qt6-opengl-devel \
              mpv-devel libexiv2-devel tesseract-ocr-devel leptonica-devel qpdf-devel libheif-devel \
              libraw-devel openjpeg2-devel libdjvulibre-devel 'pkgconfig(libturbojpeg)'
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Bauen
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
                -DKIEKAN_PKG_SUFFIX=${{ matrix.suffix }}
          cmake --build build

      - name: Testen
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: RPM-Paket
        run: cd build && cpack -G RPM

      - name: Paket installieren und Rauchtest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if command -v dnf >/dev/null; then dnf -y install ./build/kiekan-*.rpm
          else zypper -n --no-gpg-checks in ./build/kiekan-*.rpm; fi
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
                         '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | kiekan --mcp | tee mcp.out
          grep -q '"extract_text"' mcp.out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kiekan-${{ matrix.suffix }}-${{ matrix.runner }}
          path: build/*.rpm


  arch:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    # Prüft das PKGBUILD (Vorlage für das AUR) mit dem aktuellen Quelltext
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Abhängigkeiten installieren
        run: pacman -Syu --noconfirm --needed base-devel git cmake ninja qt6-base qt6-svg qt6-tools qt6-imageformats qt6-webengine mpv exiv2 tesseract leptonica qpdf libheif libraw openjpeg2 djvulibre libjpeg-turbo hicolor-icon-theme
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Bauen mit dem PKGBUILD
        run: |
          git config --global --add safe.directory "$PWD"
          useradd -m bauer
          ver=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          mkdir /home/bauer/pkg
          git archive --prefix=kiekan-$ver/ -o /home/bauer/pkg/kiekan-$ver.tar.gz HEAD
          cp packaging/arch/PKGBUILD /home/bauer/pkg/
          chown -R bauer /home/bauer/pkg
          su bauer -c 'cd /home/bauer/pkg && makepkg --noconfirm'
          pacman -U --noconfirm /home/bauer/pkg/kiekan-$ver-*-x86_64.pkg.tar.zst

  macos:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    # Apple Silicon; ohne Apple-Entwicklerkonto nur ad hoc signiert
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Abhängigkeiten installieren
        run: brew install ninja pkg-config qt mpv exiv2 tesseract qpdf libheif libraw openjpeg djvulibre jpeg-turbo librsvg

      - name: Bauen
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
          cmake --build build

      - name: Testen
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Programmpaket
        run: |
          VERSION=$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/CMakeCache.txt)
          packaging/macos/deploy.sh build dist "$VERSION"
          # Testbilder, solange die Werkzeuge noch da sind
          mkdir -p /tmp/kt
          printf '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><circle cx="32" cy="32" r="30" fill="teal"/></svg>' > /tmp/kt/test.svg
          rsvg-convert -w 128 /tmp/kt/test.svg -o /tmp/kt/test.png
          cwebp -quiet /tmp/kt/test.png -o /tmp/kt/test.webp
          sips -s format jpeg /tmp/kt/test.png --out /tmp/kt/test.jpg >/dev/null
          sips -s format heic /tmp/kt/test.png --out /tmp/kt/test.heic >/dev/null
          # Wie auf einem Mac ohne Homebrew: Homebrew für den Rauchtest wegschieben
          sudo mv /opt/homebrew /opt/homebrew-aus
          /usr/bin/python3 packaging/test/mcpsmoke.py dist/KiekAn.app/Contents/MacOS/kiekan /tmp/kt/test.*
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
                         '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | QT_QPA_PLATFORM=offscreen dist/KiekAn.app/Contents/MacOS/kiekan --mcp | tee mcp.out
          sudo mv /opt/homebrew-aus /opt/homebrew
          grep -q '"extract_text"' mcp.out
          ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kiekan-macos
          path: dist/*.dmg


  windows:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p ntldd:p
            qt6-base:p qt6-svg:p qt6-imageformats:p qt6-tools:p qt6-translations:p qt6-pdf:p
            mpv:p exiv2:p qpdf:p libheif:p libraw:p openjpeg2:p djvulibre:p libjpeg-turbo:p
            tesseract-ocr:p tesseract-data-eng:p tesseract-data-deu:p tesseract-data-frk:p

      - name: Bauen
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Testen
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Portables Paket
        run: |
          VERSION=$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/CMakeCache.txt)
          packaging/windows/deploy.sh build dist/KiekAn
          # Rauchtest: MCP-Server des fertigen Pakets (braucht das Plugin „offscreen“)
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
                        '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | dist/KiekAn/kiekan.exe --mcp | tee mcp.out
          grep -q '"extract_text"' mcp.out
          (cd dist && zip -qr "KiekAn-${VERSION}-windows-x64.zip" KiekAn)
          ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kiekan-windows
          path: dist/*.zip

  # Alle Pakete gemeinsam veröffentlichen – nur wenn alle Builds gelungen sind.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, rpm, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
